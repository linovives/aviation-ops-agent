name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: test-key
      AERODATABOX_API_KEY: test-key
      AERODATABOX_HOST: test-host
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python -m pytest tests/ -v
